name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'          # the scheduled data commits are validated by the data workflows themselves

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and data validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pipeline regression tests (GDELT queries, source states, backoff, Form D parser)
        run: python tests/test_pipeline_fixes.py
      - name: Alert detection tests
        run: python tests/test_alerts.py
      - name: Trend pipeline self-test (mocked HTTP; writes to a temp dir, never to data/)
        run: TRENDS_OUT="$RUNNER_TEMP/trends" python tests/selftest_trends.py
      - name: Validate committed data and config
        run: python tests/validate_data.py
      - name: Design-token contrast (WCAG AA)
        run: python tests/check_contrast.py
      - name: Backtest runs on committed data
        run: python scripts/backtest.py

  browser:
    name: Browser smoke test (12 tabs x dark/light x desktop/phone)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright (not added to the repo)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
      - name: Serve the site and run the smoke test
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          cp tests/smoke.mjs "$RUNNER_TEMP/pw/smoke.mjs"
          cd "$RUNNER_TEMP/pw" && node smoke.mjs http://localhost:8000/index.html
